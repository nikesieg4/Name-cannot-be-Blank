<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Sehrohrtiefe – Prototyp</title>
  <meta name="description" content="U-Boot-Simulation im Pixel-Look: Führe dein Boot und deine Crew als Kaleu.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/stil.css">
</head>
<body>
  <header id="leiste">
    <div class="titel">SEHROHRTIEFE <span>Prototyp 0.1</span></div>
    <div id="uhr">Tag 1 · 12:00 UTC</div>
    <div class="gruppe" id="tempo">
      <button data-aktion="tempo" data-arg="0" title="Pause (Leertaste)">❚❚</button>
      <button data-aktion="tempo" data-arg="1" title="Normale Geschwindigkeit (1)">1×</button>
      <button data-aktion="tempo" data-arg="2" title="Doppelt (2)">2×</button>
      <button data-aktion="tempo" data-arg="4" title="Vierfach (4)">4×</button>
    </div>
    <button id="btnAlarm" data-aktion="alarm" title="Alle auf Gefechtsstation – niemand schläft">Gefechtsstationen</button>
    <div class="gruppe rechts" id="panelKnoepfe">
      <button data-aktion="panel" data-arg="karte" title="Seekarte (M)">Karte</button>
      <button data-aktion="panel" data-arg="links" title="Besatzung und Status (C)">Besatzung</button>
      <button data-aktion="panel" data-arg="rechts" title="Kommando: Tiefe, Fahrt, Torpedos, Funk, Aufträge (K)">Kommando</button>
      <button data-aktion="inventar" title="Vorräte und Stauraum (I)">Vorräte</button>
      <button data-aktion="werftBaum" title="Ausbau des Bootes (U)">Ausbau</button>
      <button data-aktion="schichtplan">Wachen</button>
      <button data-aktion="panel" data-arg="log" title="Meldungen (L)">Meldungen</button>
    </div>
    <div class="gruppe">
      <button data-aktion="speichern" title="Spielstand als Datei speichern">Speichern</button>
      <button data-aktion="laden" title="Spielstand laden">Laden</button>
      <button data-aktion="neu" title="Neues Spiel">Neu</button>
      <button data-aktion="hilfe" title="Hilfe">?</button>
    </div>
  </header>

  <main>
    <aside id="links" class="spalte schublade">
      <button class="zu" data-aktion="panel" data-arg="links" aria-label="Besatzung schließen">✕</button>
      <section>
        <h2>Status</h2>
        <div id="status"></div>
        <div id="systeme"></div>
      </section>
      <section>
        <h2>Verpflegung</h2>
        <label class="zeile" for="ration">Rationen pro Person und Tag <b id="rationWert">3</b></label>
        <input type="range" id="ration" min="1" max="4" step="1" value="3">
        <div id="rationInfo" class="klein"></div>
      </section>
      <section class="wachsen">
        <h2>Besatzung</h2>
        <div id="crewListe"></div>
      </section>
    </aside>

    <div id="mitte">
      <div id="bootWrap">
        <canvas id="boot" aria-label="Querschnitt des U-Bootes"></canvas>
        <div class="zoom">
          <button data-aktion="zoom" data-arg="1" title="Hineinzoomen">+</button>
          <button data-aktion="zoom" data-arg="-1" title="Herauszoomen">−</button>
          <button data-aktion="zoom" data-arg="0" title="Ganzes Boot">▣</button>
        </div>
        <div id="bootHinweis"></div>
        <!-- HUD: im normalen Blick nur das Nötigste -->
        <div id="hud">
          <div id="hudLinks">
            <div id="hudFahrt" class="instrument"></div>
            <div id="hudTiefe" class="instrument"></div>
          </div>
          <div id="hudRechts">
            <div id="hudZiel"></div>
            <div id="hudZaehler"></div>
          </div>
        </div>
        <div id="meldungen" aria-live="polite"></div>
        <div id="auswahlKarte" hidden>
          <button class="zu" data-aktion="auswahlZu" aria-label="Auswahl aufheben">✕</button>
          <h2>Auswahl</h2>
          <div id="auswahl"></div>
        </div>
        <div id="steuer" hidden>
          <button data-lauf="-1" aria-label="Nach links laufen">◀</button>
          <button data-lauf="1" aria-label="Nach rechts laufen">▶</button>
          <button data-aktion="loslassen">Freigeben</button>
        </div>
      </div>
      <div id="karteWrap">
        <button class="zu" data-aktion="panel" data-arg="karte" aria-label="Karte schließen">✕</button>
        <canvas id="karte" aria-label="Seekarte"></canvas>
      </div>
    </div>

    <aside id="rechts" class="spalte schublade">
      <button class="zu" data-aktion="panel" data-arg="rechts" aria-label="Kommando schließen">✕</button>
      <section>
        <h2>Tiefe</h2>
        <div id="tiefe"></div>
        <div id="tiefenKnoepfe" class="knopfraster"></div>
        <button data-aktion="anblasen" class="breit warn">Notanblasen</button>
      </section>
      <section>
        <h2>Fahrt</h2>
        <div id="fahrtKnoepfe" class="knopfraster"></div>
        <div id="fahrtInfo"></div>
      </section>
      <section>
        <h2>Torpedos</h2>
        <div id="waffen"></div>
      </section>
      <section>
        <h2>Horchgerät</h2>
        <div id="horch"></div>
      </section>
      <section>
        <h2>Funk</h2>
        <div id="funk"></div>
      </section>
      <section>
        <h2>Aufträge</h2>
        <div id="auftraege"></div>
      </section>
    </aside>
  </main>

  <footer id="logLeiste">
    <button class="zu" data-aktion="panel" data-arg="log" aria-label="Meldungen schließen">✕</button>
    <div id="log"></div>
  </footer>

  <div id="modal" hidden>
    <div class="fenster" role="dialog" aria-modal="true">
      <button class="schliessen" data-aktion="modalZu" title="Schließen">✕</button>
      <div id="modalInhalt"></div>
    </div>
  </div>
  <input type="file" id="dateiLaden" accept=".srt,.txt" hidden>

  <script src="js/krypto.js"></script>
  <script src="js/enigma.js"></script>
  <script src="js/daten.js"></script>
  <script src="js/zustand.js"></script>
  <script src="js/speicher.js"></script>
  <script src="js/simulation.js"></script>
  <script src="js/bilder.js"></script>
  <script src="js/grafik.js"></script>
  <script src="js/karte.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/minispiele.js"></script>
  <script src="js/laderaum.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
